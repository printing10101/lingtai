<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <!-- 灵台 · 巨构观星台背景。水墨剪影：远山、雾带、满月、重楼高台。
       所有颜色都压在暗部，只留窗灯一点暖 —— 它是背景，不能跟卡片抢戏。 -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce5ef" stop-opacity=".10"/>
      <stop offset="45%" stop-color="#dce5ef" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#dce5ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonDisc" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e8eef6" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#d3ddea" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#c8d3e0" stop-opacity=".06"/>
    </radialGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080a0e" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <!-- 星与月 -->
  <g fill="#cfd9e4">
    <circle cx="180" cy="120" r="1.4" opacity=".22"/><circle cx="320" cy="90" r="1.1" opacity=".18"/>
    <circle cx="520" cy="150" r="1.3" opacity=".25"/><circle cx="640" cy="80" r="1" opacity=".15"/>
    <circle cx="760" cy="200" r="1.2" opacity=".2"/><circle cx="900" cy="120" r="1" opacity=".14"/>
    <circle cx="1020" cy="70" r="1.4" opacity=".22"/><circle cx="1180" cy="150" r="1.1" opacity=".18"/>
    <circle cx="1300" cy="90" r="1" opacity=".15"/><circle cx="1560" cy="130" r="1.3" opacity=".2"/>
    <circle cx="1700" cy="220" r="1.1" opacity=".16"/><circle cx="1820" cy="110" r="1.4" opacity=".22"/>
    <circle cx="240" cy="300" r="1" opacity=".12"/><circle cx="700" cy="320" r="1.1" opacity=".14"/>
    <circle cx="1620" cy="330" r="1" opacity=".12"/>
  </g>
  <circle cx="430" cy="250" r="300" fill="url(#moonGlow)"/>
  <circle cx="430" cy="250" r="96" fill="url(#moonDisc)"/>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#b9c3cf" stroke-width="1.4" stroke-linecap="round" opacity=".32">
    <path d="M560 190 q9 -9 18 0"/><path d="M588 178 q8 -8 16 0"/><path d="M620 192 q7 -7 14 0"/>
  </g>

  <!-- 竖排题字 -->
  <text x="920" y="220" transform="rotate(0)" style="writing-mode: vertical-rl"
        font-family="KaiTi, STKaiti, SimSun, serif" font-size="30" letter-spacing="10"
        fill="#79c7ac" opacity=".15">灵台观象</text>

  <!-- 远山两层 -->
  <path d="M0 940 Q200 880 380 918 Q520 946 700 908 Q860 876 1040 916 Q1180 946 1350 912 Q1520 880 1700 914 Q1820 934 1920 906 L1920 1080 L0 1080 Z" fill="#0d1119"/>
  <path d="M0 1010 Q260 966 520 1002 Q760 1032 1020 1000 Q1280 970 1540 1004 Q1740 1028 1920 1002 L1920 1080 L0 1080 Z" fill="#0b0e14"/>

  <!-- 台后雾带 -->
  <ellipse cx="900" cy="935" rx="520" ry="26" fill="#c9d4e0" opacity=".04"/>
  <ellipse cx="1500" cy="955" rx="560" ry="30" fill="#c9d4e0" opacity=".05"/>

  <!-- ══ 巨构观星台：三层台基 + 五重檐 + 顶层攒尖 ══ -->
  <g>
    <!-- 台基（下宽上窄，收分三叠） -->
    <ellipse cx="1450" cy="1078" rx="560" ry="14" fill="#000" opacity=".35"/>
    <rect x="1040" y="1006" width="820" height="74" fill="#10151d"/>
    <rect x="1040" y="1006" width="820" height="2.5" fill="#202937" opacity=".55"/>
    <rect x="1098" y="948" width="704" height="58" fill="#11161e"/>
    <rect x="1098" y="948" width="704" height="2.5" fill="#202937" opacity=".5"/>
    <rect x="1152" y="894" width="596" height="54" fill="#121823"/>
    <rect x="1152" y="894" width="596" height="2.5" fill="#232d3c" opacity=".5"/>

    <!-- 第一重：身 + 檐 -->
    <rect x="1218" y="824" width="464" height="70" fill="#171d28"/>
    <path d="M1184 806 Q1330 840 1450 846 Q1570 840 1716 806 Q1450 818 1184 806 Z" fill="#0d1119"/>
    <path d="M1428 894 v-30 a22 22 0 0 1 44 0 v30 z" fill="#0a0d12"/>
    <g>
      <rect x="1300" y="846" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".5"/>
      <rect x="1360" y="846" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
      <rect x="1445" y="846" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".55"/>
      <rect x="1530" y="846" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
      <rect x="1590" y="846" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".4"/>
    </g>

    <!-- 第二重 -->
    <rect x="1246" y="758" width="408" height="66" fill="#171d28"/>
    <path d="M1212 740 Q1358 774 1450 780 Q1542 774 1688 740 Q1450 752 1212 740 Z" fill="#0d1119"/>
    <g>
      <rect x="1395" y="780" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
      <rect x="1445" y="780" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".55"/>
      <rect x="1495" y="780" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
    </g>

    <!-- 第三重 -->
    <rect x="1274" y="696" width="352" height="62" fill="#161c26"/>
    <path d="M1240 678 Q1360 712 1450 718 Q1540 712 1660 678 Q1450 690 1240 678 Z" fill="#0d1119"/>
    <g>
      <rect x="1405" y="718" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".5"/>
      <rect x="1445" y="718" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
      <rect x="1485" y="718" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".4"/>
    </g>

    <!-- 第四重 -->
    <rect x="1300" y="638" width="300" height="58" fill="#161c26"/>
    <path d="M1266 620 Q1376 654 1450 660 Q1524 654 1634 620 Q1450 632 1266 620 Z" fill="#0d1119"/>
    <g>
      <rect x="1415" y="660" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
      <rect x="1445" y="660" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".5"/>
      <rect x="1475" y="660" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".35"/>
    </g>

    <!-- 第五重 -->
    <rect x="1324" y="584" width="252" height="54" fill="#151b25"/>
    <path d="M1290 566 Q1388 600 1450 606 Q1512 600 1610 566 Q1450 578 1290 566 Z" fill="#0d1119"/>
    <g>
      <rect x="1415" y="606" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".55"/>
      <rect x="1450" y="606" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>
    </g>

    <!-- 顶层阁 + 檐 + 攒尖顶 + 宝顶 -->
    <rect x="1350" y="536" width="200" height="48" fill="#151b25"/>
    <path d="M1320 518 Q1400 552 1450 558 Q1500 552 1580 518 Q1450 530 1320 518 Z" fill="#0d1119"/>
    <path d="M1356 524 Q1410 532 1450 534 Q1490 532 1544 524 L1450 468 Z" fill="#0e131d"/>
    <rect x="1447" y="440" width="6" height="30" rx="3" fill="#0e131d"/>
    <circle cx="1450" cy="436" r="5" fill="#0e131d"/>
    <rect x="1443" y="556" width="9" height="14" rx="1.5" fill="#6fd0b2" opacity=".6"/>
    <rect x="1458" y="556" width="9" height="14" rx="1.5" fill="#0a0d12" opacity=".8"/>

    <!-- 檐角灯笼：只点几盏，别满串 -->
    <g fill="#6fd0b2">
      <circle cx="1192" cy="810" r="3" opacity=".5"/><circle cx="1708" cy="810" r="3" opacity=".35"/>
      <circle cx="1248" cy="682" r="3" opacity=".45"/><circle cx="1652" cy="682" r="3" opacity=".3"/>
      <circle cx="1298" cy="570" r="3" opacity=".4"/>
    </g>
  </g>

  <!-- 台前雾带（把台基坐进雾里） -->
  <ellipse cx="1400" cy="1005" rx="640" ry="34" fill="#c9d4e0" opacity=".045"/>
  <ellipse cx="1000" cy="1052" rx="760" ry="40" fill="#c9d4e0" opacity=".05"/>
  <rect x="0" y="1020" width="1920" height="60" fill="url(#groundFade)"/>
</svg>
