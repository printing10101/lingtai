<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 灵台 · 应用图标：朱砂印章 + 观星台剪影。
       与界面同源：印面朱砂（bad 色相）、台身象牙白、宝顶一点青绿（accent）。
       塔身沿用 bg-tower.svg 的飞檐月牙形，放大看有细节，缩到 16px 仍是「红方块上一座塔」。 -->
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8493b"/>
      <stop offset=".55" stop-color="#93312a"/>
      <stop offset="1" stop-color="#7c2a22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 印面 -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#seal)"/>
  <rect x="8" y="8" width="240" height="120" rx="52" fill="url(#sheen)"/>
  <!-- 印框双栏 -->
  <rect x="26" y="26" width="204" height="204" rx="40" fill="none"
        stroke="#f6e7d7" stroke-opacity=".5" stroke-width="5"/>
  <rect x="38" y="38" width="180" height="180" rx="32" fill="none"
        stroke="#f6e7d7" stroke-opacity=".22" stroke-width="2.5"/>

  <!-- 观星台：三重飞檐 + 攒尖顶（形状与 bg-tower.svg 同源） -->
  <g transform="translate(0,12)">
    <g fill="#f6e7d7">
      <!-- 台基 -->
      <rect x="80" y="182" width="96" height="12" rx="3"/>
      <!-- 第一重：身 + 檐 -->
      <rect x="98" y="152" width="60" height="28" rx="3"/>
      <path d="M60 140 Q100 166 128 170 Q156 166 196 140 Q128 150 60 140 Z"/>
      <!-- 第二重 -->
      <rect x="104" y="122" width="48" height="26" rx="3"/>
      <path d="M74 111 Q106 134 128 137 Q150 134 182 111 Q128 120 74 111 Z"/>
      <!-- 第三重 -->
      <rect x="110" y="94" width="36" height="24" rx="3"/>
      <path d="M86 84 Q112 105 128 108 Q144 105 170 84 Q128 93 86 84 Z"/>
      <!-- 顶层阁 + 檐 -->
      <rect x="116" y="72" width="24" height="18" rx="3"/>
      <path d="M100 63 Q118 82 128 84 Q138 82 156 63 Q128 71 100 63 Z"/>
      <!-- 攒尖顶：内凹四棱锥 -->
      <path d="M128 44 Q122 58 116 64 L140 64 Q134 58 128 44 Z"/>
    </g>
    <!-- 宝顶一点青绿（界面的 accent 色） -->
    <circle cx="128" cy="40" r="6" fill="#3ebfa0"/>
    <!-- 窗灯：朱砂底上镂空，缩小时融成塔身纹理 -->
    <g fill="#93312a">
      <rect x="104" y="158" width="7" height="11" rx="2"/>
      <rect x="124.5" y="158" width="7" height="11" rx="2"/>
      <rect x="145" y="158" width="7" height="11" rx="2"/>
      <rect x="124.5" y="128" width="7" height="10" rx="2"/>
    </g>
  </g>
  <!-- 残星两点 -->
  <circle cx="74" cy="76" r="4" fill="#f6e7d7" opacity=".65"/>
  <circle cx="186" cy="90" r="3" fill="#f6e7d7" opacity=".45"/>
</svg>
